# ---------------------------------------------------------------
# Conexion a MySQL
# Las credenciales se leen de variables de entorno para no subirlas a GitHub.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrotech}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true

server.port=${PORT:8080}

# Respuestas de error sin traza tecnica hacia el cliente
server.error.include-stacktrace=never
