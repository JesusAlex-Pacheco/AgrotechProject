# ---------------------------------------------------------------
# Conexion a MySQL
# Las credenciales se leen de variables de entorno para no subirlas a GitHub.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agrotech}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true

# ---------------------------------------------------------------
# JPA (usuarios, entregas y resenas)
# validate: Hibernate comprueba al arrancar que las entidades coincidan con
# las tablas creadas por db/01_esquema_mysql.sql; nunca crea ni borra tablas.
# open-in-view=false: la sesion de JPA se cierra al terminar el servicio, asi
# que las consultas cargan explicitamente (JOIN FETCH) lo que se va a mostrar.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# ---------------------------------------------------------------
# Seguridad
# jwt-secreto: clave HMAC con la que se firman los tokens de sesion (minimo
# 32 caracteres). Si la variable JWT_SECRET no existe, se genera una clave
# aleatoria al arrancar: funciona igual, pero las sesiones abiertas se
# cierran cada vez que se reinicia el backend.
# ---------------------------------------------------------------
agrotech.seguridad.jwt-secreto=${JWT_SECRET:}
agrotech.seguridad.duracion-sesion=8h

# Cuenta de administrador que se crea al arrancar si aun no existe. El
# registro publico no permite el rol ADMIN: esta es la unica forma de crearlo.
# Solo se guarda el hash BCrypt; la clave en texto plano no esta en el codigo.
# Se puede reemplazar con las variables ADMIN_CORREO y ADMIN_CLAVE_HASH.
agrotech.admin.nombre=Administrador AgroTech
agrotech.admin.correo=${ADMIN_CORREO:admin@agrotech.co}
agrotech.admin.clave-hash=${ADMIN_CLAVE_HASH:$2a$10$s9iK.rhBT8./FtC7JyTG6Ou6agvCui1hi/OFfwqYVpPwLb81Pyz4u}

# ---------------------------------------------------------------
# Fotos de los productos
# Se guardan como archivos en esta carpeta (relativa a donde se ejecuta la
# API) y se publican en /api/fotos/<archivo>. La base solo guarda esa ruta.
# ---------------------------------------------------------------
agrotech.fotos.directorio=${FOTOS_DIR:fotos}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Respuestas de error sin traza tecnica hacia el cliente
spring.web.error.include-stacktrace=never
