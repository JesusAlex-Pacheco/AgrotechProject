plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.itm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Aporta el DataSource (HikariCP). El catalogo y las ventas se implementan
	// con JDBC puro: Connection, PreparedStatement y SQL escrito a mano.
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// Usuarios, entregas y resenas se persisten con JPA (Hibernate) sobre el
	// mismo DataSource, con las relaciones mapeadas en las entidades.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Solo el modulo de cifrado de Spring Security: BCrypt para las claves.
	implementation 'org.springframework.security:spring-security-crypto'

	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Documentacion interactiva de la API: http://localhost:8080/swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'com.mysql:mysql-connector-j:9.5.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
